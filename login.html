<!DOCTYPE html>
<!-- Added overflow-hidden and h-screen to lock the root -->
<html lang="en" x-data="authApp()" :class="darkMode ? 'dark' : ''" :dir="isRtl ? 'rtl' : 'ltr'" class="overflow-hidden h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%230284c7' stroke-width='2.5'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z' /%3E%3C/svg%3E">
    <title>Login | GlassGo Mobile Auto Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0284c7', secondary: '#0ea5e9' },
                    animation: { 'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        
        /* Ensures the height is exactly the visual viewport, accounting for mobile browser bars */
        .safe-viewport { height: 100vh; height: 100dvh; }

        .glass-effect {
            backdrop-filter: blur(16px);
            background-color: rgba(255, 255, 255, 0.85);
        }
        .dark .glass-effect { background-color: rgba(15, 23, 42, 0.85); }

        /* Custom scrollbar for the internal card scroll if needed on tiny screens */
        .card-scroll::-webkit-scrollbar { width: 4px; }
        .card-scroll::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 safe-viewport flex flex-col transition-colors duration-300 overflow-hidden">

    <!-- Nav (Fixed size, won't shrink) -->
    <nav class="shrink-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-primary p-2 rounded-lg text-white group-hover:rotate-12 transition-transform shadow-lg shadow-primary/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <span class="text-2xl font-black tracking-tighter dark:text-white">Glass<span class="text-primary">Go</span></span>
        </a>

        <div class="flex items-center gap-2">
            <button @click="toggleRtl()" class="p-2.5 rounded-xl bg-white dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 font-black text-[10px] uppercase tracking-widest hover:bg-gray-50 transition-all">
                <span x-text="isRtl ? 'LTR' : 'RTL'"></span>
            </button>
            <button @click="toggleDark()" class="p-2.5 rounded-xl bg-white dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 hover:bg-gray-50 transition-all">
                <template x-if="!darkMode">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </template>
                <template x-if="darkMode">
                    <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                </template>
            </button>
        </div>
    </nav>

    <!-- Main (Center container) -->
    <main class="flex-grow flex items-center justify-center px-4 relative overflow-hidden">
        <!-- Background Decor -->
        <div class="absolute top-1/4 -left-20 w-80 h-80 bg-primary/20 rounded-full blur-[100px] animate-pulse-slow"></div>
        <div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-blue-400/10 rounded-full blur-[100px] animate-pulse-slow"></div>

        <!-- The Card -->
        <!-- Logic: max-h-full ensures it fits in screen, overflow-y-auto allows internal scrolling on small heights -->
        <div class="w-full max-w-md relative z-10 glass-effect rounded-[3rem] shadow-2xl border border-white/20 dark:border-gray-800 flex flex-col max-h-[90%] overflow-hidden">
            
            <div class="p-8 md:p-10 overflow-y-auto card-scroll flex-grow">
                <div class="text-center mb-8 shrink-0">
                    <h1 class="text-3xl font-black text-gray-900 dark:text-white mb-2">Welcome Back</h1>
                    <p class="text-gray-500 dark:text-gray-400 font-medium">Log in to manage your repairs</p>
                </div>

                <form @submit.prevent class="space-y-5">
                    <div class="space-y-1">
                        <label class="text-xs font-black uppercase tracking-widest text-gray-400 ml-1">Email Address</label>
                        <input type="email" placeholder="name@company.com" 
                               class="w-full px-5 py-4 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white">
                    </div>

                    <div class="space-y-1" x-data="{ showPassword: false }">
                        <label class="text-xs font-black uppercase tracking-widest text-gray-400 ml-1">Password</label>
                        <div class="relative group">
                            <input :type="showPassword ? 'text' : 'password'" placeholder="••••••••" 
                                   class="w-full px-5 py-4 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all dark:text-white pr-14">
                            <button type="button" @click="showPassword = !showPassword" 
                                    class="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-primary transition-colors focus:outline-none">
                                <svg x-show="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                <svg x-show="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" /></svg>
                            </button>
                        </div>
                        <div class="flex items-center justify-between mt-2 px-1">
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
                                <span class="text-[10px] font-black uppercase tracking-tight text-gray-500 group-hover:text-primary transition-colors">Remember</span>
                            </label>
                            <a href="#" class="text-[10px] font-black uppercase tracking-tight text-primary hover:underline">Forgot?</a>
                        </div>
                    </div>

                    <button class="w-full py-4 bg-primary hover:bg-blue-600 text-white rounded-2xl font-black text-lg shadow-xl shadow-primary/30 transform active:scale-95 transition-all">
                        Log In
                    </button>
                </form>

                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-700"></div></div>
                    <div class="relative flex justify-center text-[10px] uppercase font-black tracking-widest"><span class="bg-white dark:bg-slate-900 px-4 text-gray-400">Social Connect</span></div>
                </div>

                <div class="flex justify-center gap-4">
                    <button class="p-4 rounded-2xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 hover:bg-gray-50 transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"/></svg>
                    </button>
                    <button class="p-4 rounded-2xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 hover:bg-gray-50 transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/></svg>
                    </button>
                    <button class="p-4 rounded-2xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 hover:bg-gray-50 transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/></svg>
                    </button>
                </div>

                <p class="text-center mt-8 text-sm font-bold text-gray-500 pb-2">
                    New here? <a href="regeister.html" class="text-primary hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        function authApp() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                isRtl: localStorage.getItem('isRtl') === 'true',
                toggleDark() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                },
                toggleRtl() {
                    this.isRtl = !this.isRtl;
                    localStorage.setItem('isRtl', this.isRtl);
                }
            }
        }
    </script>
</body>
</html>
